[package]
name = "boost_coroutine2"
description = "Boost C++ library boost_coroutine2 packaged using Zanbil"
version = "0.1.0"
edition = "2024"
links = "boost_coroutine2"
license = "BSL-1.0"
repository = "https://github.com/zanbilify/boost_coroutine2"

[package.metadata.zanbil]
make_dependencies_public = true

[dependencies]
boost_assert = { version = "0.1.0", path = "../boost_assert" }
boost_config = { version = "0.1.0", path = "../boost_config" }
boost_context = { version = "0.1.0", path = "../boost_context" }

[build-dependencies]
zanbil-boost-build = "0.1.0"
